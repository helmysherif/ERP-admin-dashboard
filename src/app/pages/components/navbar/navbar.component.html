<div class="navbar" [class.open]="isSidebarOpen2()">
  <div class="left">
    <button class="toggle-sidebar" (click)="toggleSidebar()">
      <span class="hamburger-icon" [class.open]="isOpened">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>
    <button class="responsive-toggle-sidebar" (click)="toggleSidebarDrawer()">
      <span class="hamburger-icon" [class.open]="isOpened">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>
    <div class="search-input">
      <i class="pi pi-search"></i>
      <input type="text" [placeholder]="'SEARCH_PLACEHOLDER' | translate" />
    </div>
  </div>
  <div class="right">
    <div class="languages-dropdown" #langDropdown>
      <div class="selected-flag" (click)="toggleLangDropdown()">
        <img
          [src]="currentLang.flag"
          [alt]="currentLang.englishName"
          height="20px"
        />
      </div>
      <div
        class="languages-selection"
        [class.arabic-dir]="currentLang.englishName === 'Arabic'"
        [class.active]="isLangDropdownOpen()"
      >
        @for (lang of languages; track $index) {
          <div
            class="lang"
            (click)="switchLang(lang)"
            [class.active]="currentLang.englishName === lang.englishName"
          >
            <img [src]="lang.flag" [alt]="lang.englishName" height="20px" />
            <span>{{
              currentLang.englishName === "Arabic"
                ? lang.arabicName
                : lang.englishName
            }}</span>
          </div>
        }
      </div>
    </div>
    <div class="cart-section">
      <i class="ri-shopping-bag-line"></i>
    </div>
    <div class="change-theme-section" (click)="changeTheming()">
      <i
        class="pi"
        [ngClass]="currentTheme === 'light' ? 'pi-moon' : 'pi-sun'"
      ></i>
    </div>
  </div>
</div>
